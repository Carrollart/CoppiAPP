<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4ece9"><link rel="manifest" href="manifest.json"><title>CoppiAPP</title>
<style>
:root{--bg:#f6f1ef;--card:#fff;--txt:#292525;--muted:#716965;--accent:#5a4740;--line:#e4d8d3}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--txt)}
.wrap{max-width:650px;margin:auto;padding:18px 16px 40px}h1{font-size:34px;margin:4px 0 0}.sub{color:var(--muted);margin:2px 0 20px}
.card{background:var(--card);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 6px 22px rgba(0,0,0,.06)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:white;font-size:15px}
.result{text-align:center;padding:22px 12px}.area{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.activity{font-size:22px;line-height:1.25;margin:12px 0}.rule{font-size:14px;font-style:italic;color:var(--muted)}.meta{font-size:12px;color:var(--muted);margin-top:14px}
button{border:0;border-radius:14px;padding:14px 16px;font-size:15px;font-weight:700}.primary{background:var(--accent);color:white;width:100%;font-size:18px}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}.secondary{background:#eee4e0;color:var(--txt)}.small{font-size:12px;color:var(--muted);text-align:center;margin-top:16px}
.hist{font-size:13px;line-height:1.4;border-top:1px solid var(--line);padding:9px 0}@media(max-width:420px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<h1>CoppiAPP</h1><div class="sub">600 attività condivise · 100 per categoria</div>
<div class="card grid">
<div><label>Categoria</label><select id="category"><option>Qualsiasi</option><option>Casa</option><option>Uscita</option><option>Gioco</option><option>Connessione</option><option>Progetto</option><option>Cibo</option></select></div>
<div><label>Bisogno</label><select id="mode"><option>Connettersi</option><option>Rigenerare</option><option>Giocare</option><option>Esplorare</option><option>Progettare</option></select></div>

<div><label>Voglia di parlare</label><select id="talk"><option value="0">0 · niente</option><option value="1" selected>1 · poca</option><option value="2">2 · media</option><option value="3">3 · molta</option></select></div>
<div><label>Dove</label><select id="place"><option>Indifferente</option><option>Casa</option><option>Fuori</option></select></div>
<div><label>Budget</label><select id="budget"><option value="0">0 · gratis</option><option value="1" selected>1 · basso</option><option value="2">2 · libero</option></select></div>
<div><label>Situazione</label><select id="state"><option>Siamo indecise</option><option>Siamo stanche</option><option>Ci annoiamo</option><option>Abbiamo bisogno di vicinanza</option><option>Vogliamo fare qualcosa</option><option>Vogliamo uscire</option><option>Vogliamo stare a casa</option></select></div>
</div>
<div class="card result"><div class="area" id="area">—</div><div class="activity" id="activity">Premete DECIDI PER NOI</div><div class="rule" id="rule"></div><div class="meta" id="meta"></div></div>
<button class="primary" onclick="decide()">DECIDI PER NOI</button>
<div class="row"><button class="secondary" onclick="feedback('ci_va')">CI VA</button><button class="secondary" onclick="easier()">TROPPO SBATTI</button><button class="secondary" onclick="feedback('non_ci_va',true)">NON CI VA</button></div>

let current=null;
function v(id){return document.getElementById(id).value}
function score(a){
 let s=0,cat=v('category'),mode=v('mode'),energy=+v('energy'),minutes=+v('minutes'),talk=+v('talk'),place=v('place'),budget=+v('budget'),state=v('state');
 if(cat!=='Qualsiasi'&&a.area!==cat)return -9999;
 if(a.modes.includes(mode))s+=5;s+=a.energy<=energy?3:-5;s+=a.time<=minutes?3:-6;s+=Math.abs(a.talk-talk)<=1?2:-2;
 s+=place==='Indifferente'||a.place===place?3:-5;s+=a.budget<=budget?2:-5;
 if(state==='Siamo stanche'&&a.energy===1)s+=4;if(state==='Ci annoiamo'&&(a.modes.includes('Giocare')||a.modes.includes('Esplorare')))s+=4;

}
function decide(){
 const ranked=[...ACTIVITIES].sort((a,b)=>score(b)-score(a)).filter(a=>score(a)>-9000),pool=ranked.slice(0,Math.min(20,ranked.length));

}

function feedback(outcome,again=false){log(outcome);if(again)decide();else current=null}
